<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cines y Estrenos - Leaflet</title>
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { width: 100%; height: 100%; background: #121212; }

        /* Popups personalizados estilo M3 Dark */
        .leaflet-popup-content-wrapper {
            background: #1e1e1e;
            color: #ffffff;
            border-radius: 12px;
            padding: 4px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            border: 1px solid #333333;
        }
        .leaflet-popup-tip {
            background: #1e1e1e;
        }
        .cine-popup {
            padding: 8px 10px;
        }
        .cine-popup h3 {
            font-size: 16px;
            color: #E5A645;
            margin-bottom: 6px;
            font-weight: 700;
        }
        .cine-popup p {
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .cine-popup .badge-horario {
            display: inline-block;
            background: #332714;
            color: #E5A645;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
            border: 1px solid #E5A645;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Inicializar mapa centrado en Colombia / Valledupar - Aguachica
        var map = L.map('map', {
            zoomControl: false
        }).setView([8.3075, -73.6180], 12);

        // Añadir controles de zoom en la esquina superior derecha
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Capa de mapa OpenStreetMap (CartoDB Dark Matter o Standard OSM)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var markersGroup = L.layerGroup().addTo(map);

        // Icono personalizado para cines
        var cinemaIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/2809/2809590.png',
            iconSize: [38, 38],
            iconAnchor: [19, 38],
            popupAnchor: [0, -34]
        });

        function cargarCines(cinesJson) {
            markersGroup.clearLayers();
            var cines = typeof cinesJson === 'string' ? JSON.parse(cinesJson) : cinesJson;

            if (!cines || cines.length === 0) return;

            var bounds = [];
            cines.forEach(function(cine) {
                var lat = parseFloat(cine.latitude || cine.lat);
                var lng = parseFloat(cine.longitude || cine.lng);

                if (isNaN(lat) || isNaN(lng)) return;

                var popupContent = `
                    <div class="cine-popup">
                        <h3>📍 ${cine.name || cine.nombre}</h3>
                        <p><strong>🍿 Película:</strong> ${cine.movieTitle || cine.pelicula || ''}</p>
                        <p><strong>🏠 Dirección:</strong> ${cine.address || cine.direccion || 'Centro Comercial'}</p>
                        <div class="badge-horario">⏰ ${cine.showtimes || cine.horarios || '15:00, 18:30, 21:00'}</div>
                    </div>
                `;

                var marker = L.marker([lat, lng], { icon: cinemaIcon }).addTo(markersGroup);
                marker.bindPopup(popupContent);
                bounds.push([lat, lng]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }
        }
    </script>
</body>
</html>
